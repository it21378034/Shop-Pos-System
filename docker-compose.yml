services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: grocerypro-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=GroceryPro@2026Pass!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GroceryPro@2026Pass!' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grocerypro-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=database,1433;Database=GroceryProDB;User Id=sa;Password=GroceryPro@2026Pass!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - Jwt__SecretKey=GroceryPro_Super_Secret_Key_For_Jwt_Signing_Must_Be_Long_2026
      - Jwt__Issuer=GroceryPro
      - Jwt__Audience=GroceryProClient
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grocerypro-ui
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sqlserver-data:
